name: Preview Release

on:
  push:
    branches:
      - "releases/preview*"

# Prevent concurrent preview releases
concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  DOTNET_VERSION: ${{ vars.DOTNET_VERSION }}
  BUILD_CONFIGURATION: "Release"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-publish-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cache NuGet packages for faster builds
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Get preview version number
        id: preview_version
        run: |
          # Extract version from branch name
          # Branch format: releases/preview-vX.Y.Z or releases/preview-X.Y.Z
          BRANCH_NAME=${GITHUB_REF#refs/heads/releases/}
          
          # Try to extract version from branch name
          if [[ "$BRANCH_NAME" =~ v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            echo "Extracted version from branch name: $MAJOR.$MINOR.$PATCH"
          else
            echo "Error: Cannot determine version from branch name '$BRANCH_NAME'. Ensure it follows 'releases/preview-vX.Y.Z' format."
            exit 1
          fi
          
          # Use GitHub run number as prerelease identifier for uniqueness
          # Format: Major.Minor.Patch-preview.RunNumber
          PREVIEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-preview.${GITHUB_RUN_NUMBER}"
          
          echo "version=${PREVIEW_VERSION}" >> $GITHUB_OUTPUT
          echo "::notice ::Preview version: ${PREVIEW_VERSION}"

      - name: Discover and verify templates
        id: discover_templates
        run: |
          echo "Discovering template projects in src/..."
          
          # Find all template.json files
          TEMPLATE_CONFIGS=$(find src -name "template.json" -path "*/.template.config/template.json")
          
          if [ -z "$TEMPLATE_CONFIGS" ]; then
            echo "Error: No template.json files found in src/"
            exit 1
          fi
          
          TEMPLATE_COUNT=0
          TEMPLATE_PATHS=""
          
          # Verify each template
          for template_config in $TEMPLATE_CONFIGS; do
            TEMPLATE_DIR=$(dirname $(dirname "$template_config"))
            TEMPLATE_NAME=$(basename "$TEMPLATE_DIR")
            
            echo "Found template: $TEMPLATE_NAME at $TEMPLATE_DIR"
            
            # Validate template.json is valid JSON
            if ! jq . "$template_config" > /dev/null 2>&1; then
              echo "Error: $template_config is not valid JSON"
              exit 1
            fi
            
            # Extract shortName for verification
            SHORT_NAME=$(jq -r '.shortName // "unknown"' "$template_config")
            echo "  - Short name: $SHORT_NAME"
            
            TEMPLATE_PATHS="$TEMPLATE_PATHS $TEMPLATE_DIR"
            TEMPLATE_COUNT=$((TEMPLATE_COUNT + 1))
          done
          
          echo "template_paths=$TEMPLATE_PATHS" >> $GITHUB_OUTPUT
          echo "template_count=$TEMPLATE_COUNT" >> $GITHUB_OUTPUT
          echo "::notice ::Discovered $TEMPLATE_COUNT template(s)"

      - name: Build template projects
        run: |
          echo "Building all template projects..."
          
          # Build each template project
          for template_dir in ${{ steps.discover_templates.outputs.template_paths }}; do
            echo "Building: $template_dir"
            
            # Find solution file
            SLN_FILE=$(find "$template_dir" -maxdepth 1 -name "*.sln" | head -n 1)
            
            if [ -n "$SLN_FILE" ]; then
              dotnet restore "$SLN_FILE"
              dotnet build "$SLN_FILE" \
                --configuration ${{ env.BUILD_CONFIGURATION }} \
                --no-restore
            else
              echo "Warning: No solution file found in $template_dir"
            fi
          done

      - name: Pack template NuGet package
        run: |
          mkdir -p ./artifacts
          
          echo "Packing preview package with ${{ steps.discover_templates.outputs.template_count }} template(s)..."
          
          # Pack the template using the existing csproj
          # This creates ONE package containing ALL templates from src/
          dotnet pack ./MiCake.Templates.csproj \
            --configuration ${{ env.BUILD_CONFIGURATION }} \
            --output ./artifacts \
            -p:PackageVersion=${{ steps.preview_version.outputs.version }}
          
          echo "::notice ::Created preview package with ${{ steps.discover_templates.outputs.template_count }} template(s)"

      # Get a short-lived NuGet API key using OIDC
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push preview packages to NuGet.org
        run: |
          for package in ./artifacts/*.nupkg; do
            echo "Pushing $package..."
            dotnet nuget push "$package" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create preview release summary
        run: |
          echo "## 🚀 Preview Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ steps.preview_version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Templates Count** | \`${{ steps.discover_templates.outputs.template_count }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${GITHUB_REF#refs/heads/}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg in ./artifacts/*.nupkg; do
            pkgname=$(basename "$pkg" .nupkg)
            echo "- \`$pkgname\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "dotnet new install MiCake.Templates::${{ steps.preview_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Create a new project" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "dotnet new micake-webapi -n YourProjectName" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-packages-${{ steps.preview_version.outputs.version }}
          path: |
            ./artifacts/*.nupkg
          retention-days: 30
